<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            overflow: hidden;
            color: #0f172a;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at top right, #00b7ff, #1421df);
        }

        .studio-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.03);
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .animate-float {
            animation: icon-float 6s ease-in-out infinite;
        }

        .text-gradient {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="canvas-container">
        <canvas id="blueprintCanvas"></canvas>
    </div>

    <main class="relative z-10 w-full max-w-2xl px-6">
        <div class="studio-card rounded-[3rem] p-12 md:p-16">
            
            <div class="flex flex-col md:flex-row items-center gap-10">
                <!-- Bagian Ikon -->
                <div class="flex-shrink-0 animate-float">
                    <div class="w-32 h-32 md:w-40 md:h-40 bg-blue-600 rounded-[2.5rem] flex items-center justify-center shadow-2xl shadow-blue-200">
            <div class="floating-icon mb-8 inline-block">
                <div class="relative bg-blue-100 p-6 rounded-3xl border-2 border-white shadow-inner">
                    <i class="ph-duotone ph-gear-six text-6xl text-blue-600"></i>
                </div>
            </div>
                    </div>
                </div>

                <!-- Bagian Teks -->
                <div class="flex-1 text-center md:text-left">
                    <div class="inline-flex items-center gap-2 px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-ping"></span>
                        Status: Optimalisasi
                    </div>
                    <h1 class="text-4xl md:text-4xl font-extrabold tracking-tighter text-gradient leading-tight mb-4">
                        Sedang dalam pengembangan.
                    </h1>
                    <p class="text-slate-500 font-medium leading-relaxed">
                        Kami sedang menyempurnakan setiap detail untuk memastikan layanan terbaik bagi Anda.
                    </p>
                </div>
            </div>

            <div class="mt-12 space-y-6">
                <div class="flex flex-wrap gap-4 justify-between items-end">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Target Penyelesaian</p>
                    </div>
                    <div class="text-right">
                        <p id="progress-text" class="text-2xl font-extrabold text-blue-600">40%</p>
                    </div>
                </div>
                
                <div class="relative h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-blue-600 rounded-full transition-all duration-1000 ease-in-out" style="width: 30%"></div>
                </div>
            </div>

            <div class="mt-12 flex flex-col sm:flex-row gap-4">
                <button onclick="location.href='file:///C:/Users/Administrator/Downloads/Portofolio-Sanhaji/index.html'" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-blue-600 transition-all flex items-center justify-center gap-3 shadow-xl transform active:scale-95">
                    <i class="ph-bold ph-house-line text-xl"></i>
                    Beranda Utama
                </button>
                <button onclick="contactWA()" class="flex-1 py-4 bg-white text-blue-600 border border-slate-200 rounded-2xl font-bold hover:border-blue-300 hover:bg-blue-50 transition-all flex items-center justify-center gap-3 shadow-sm transform active:scale-95">
                    <i class="ph-bold ph-whatsapp-logo text-xl"></i>
                    Bantuan Cepat
                </button>
            </div>

        </div>

        <p class="text-center mt-10 text-white text-[11px] font-bold uppercase tracking-[0.2em]">
            &copy; Designed & Crafted with ❤️<span class=" font-bold"> By San </span>2026.
        </p>
    </main>

    <script>
        const canvas = document.getElementById('blueprintCanvas');
        const ctx = canvas.getContext('2d');
        let lines = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            lines = [];
            for(let i = 0; i < 15; i++) {
                lines.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: Math.random() * 300 + 100,
                    speed: Math.random() * 0.5 + 0.1,
                    angle: Math.PI / 4 // 45 derajat agar terlihat seperti blueprint
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(37, 99, 235, 0.05)';
            ctx.lineWidth = 1;

            // Gambar grid halus
            const step = 50;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            lines.forEach(l => {
                l.x += l.speed;
                l.y += l.speed;
                if(l.x > canvas.width) l.x = -l.length;
                if(l.y > canvas.height) l.y = -l.length;

                ctx.beginPath();
                ctx.moveTo(l.x, l.y);
                ctx.lineTo(l.x + l.length, l.y + l.length);
                ctx.stroke();
            });
            requestAnimationFrame(draw);
        }

        function contactWA() {
            const phoneNumber = "6285895781471";
            const message = "Halo Admin, saya ingin menanyakan mengenai program layanan Anda.";
            const waUrl = `https://api.whatsapp.com/send/?phone=${phoneNumber}&text=${encodeURIComponent(message)}&type=phone_number&app_absent=0`;
            window.open(waUrl, '_blank');
        }

        window.addEventListener('resize', init);
        window.onload = () => {
            init();
            draw();
            setTimeout(() => {
                document.getElementById('progress-bar').style.width = '72%';
                document.getElementById('progress-text').innerText = '72%';
            }, 1000);
        };
    </script>
</body>
</html>
